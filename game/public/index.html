<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalndar</title>
<link rel="icon" href="icons/favicon.ico" type="image/x-icon">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16171d">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="identityScreen" class="screen hidden">
  <div class="identity-card">
    <div id="familyGate">
      <h1>Mot de passe familial</h1>
      <form id="familyLoginForm" class="login-form">
        <label>
          Mot de passe
          <input type="password" id="familyPassword" required autocomplete="current-password">
        </label>
        <p id="familyLoginError" class="form-error hidden"></p>
        <button type="submit" class="primary-btn">Entrer</button>
      </form>
    </div>

    <div id="identityPicker" class="hidden">
      <h1>Qui es-tu ?</h1>
      <div id="identityList" class="identity-list"></div>
    </div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <div class="app-shell">
    <nav id="mainNav" class="main-nav">
      <button type="button" class="nav-btn active" data-view="month">
        <span class="nav-icon">📅</span><span class="nav-label">Mois</span>
      </button>
      <button type="button" class="nav-btn" data-view="agenda">
        <span class="nav-icon">🗓️</span><span class="nav-label">Agenda</span>
      </button>
      <button type="button" class="nav-btn" data-view="notes">
        <span class="nav-icon">📝</span><span class="nav-label">Notes</span>
      </button>
      <button type="button" class="nav-btn" data-view="todos">
        <span class="nav-icon">✅</span><span class="nav-label">Tâches</span>
      </button>
      <button type="button" class="nav-btn" data-view="birthdays">
        <span class="nav-icon">🎂</span><span class="nav-label">Anniv.</span>
      </button>
    </nav>

    <div class="app-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1>k<span class="title-rest">al'n'dar</span></h1>
        </div>
        <div class="topbar-right">
          <div id="memberFilters" class="member-checkboxes"></div>
        </div>
      </header>

      <div id="view-month" class="view">
        <div class="app-layout">
          <div class="calendar-main">
            <div class="toolbar">
              <div class="nav-group">
                <button id="prevMonthBtn" class="icon-btn" aria-label="Mois précédent">‹</button>
                <button id="todayBtn" class="today-btn">Aujourd'hui</button>
                <button id="nextMonthBtn" class="icon-btn" aria-label="Mois suivant">›</button>
              </div>
              <h2 id="monthLabel" class="month-label"></h2>
            </div>

            <div class="weekdays" id="weekdaysRow"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>

          <aside class="day-panel">
            <div class="day-panel-header">
              <h2 id="dayPanelDate"></h2>
              <button id="dayPanelAddBtn" class="day-panel-add-btn" aria-label="Ajouter un événement"></button>
            </div>
            <div class="day-panel-list" id="dayPanelList"></div>
          </aside>
        </div>
      </div>

      <div id="view-agenda" class="view hidden">
        <div class="agenda-toolbar">
          <div class="agenda-nav-group">
            <button id="agendaPrevBtn" class="icon-btn" aria-label="Précédent">‹</button>
            <button id="agendaTodayBtn" class="today-btn">Aujourd'hui</button>
            <button id="agendaNextBtn" class="icon-btn" aria-label="Suivant">›</button>
          </div>
          <h2 id="agendaLabel" class="month-label"></h2>
          <button id="agendaAddBtn" class="day-panel-add-btn" aria-label="Ajouter un événement"></button>
        </div>
        <div class="agenda-grid" id="agendaGrid"></div>
      </div>

      <div id="view-notes" class="view hidden">
        <div class="notes-layout">
          <div class="notes-list-pane" id="notesListPane">
            <div class="notes-list-header">
              <h2>Notes</h2>
              <button type="button" id="noteAddBtn" class="day-panel-add-btn" aria-label="Nouvelle note"></button>
            </div>
            <div class="notes-list" id="notesList"></div>
          </div>
          <div class="notes-editor-pane" id="notesEditorPane">
            <button type="button" id="noteBackBtn" class="secondary-btn notes-back-btn">‹ Retour</button>
            <input type="text" id="noteTitleInput" class="notes-title-input" placeholder="Titre" maxlength="200">
            <textarea id="noteBodyInput" class="notes-body-input" placeholder="Écris ici…"></textarea>
            <button type="button" id="noteDeleteBtn" class="danger-btn">Supprimer</button>
          </div>
        </div>
      </div>

      <div id="view-todos" class="view hidden">
        <h2>Tâches</h2>
        <form id="todoForm" class="todo-form">
          <input type="text" id="todoInput" placeholder="Nouvelle tâche…" maxlength="300" required autocomplete="off">
          <button type="submit" class="primary-btn">Ajouter</button>
        </form>
        <div class="todo-list" id="todoList"></div>
      </div>

      <div id="view-birthdays" class="view hidden">
        <h2>Anniversaires</h2>
        <form id="birthdayForm" class="birthday-form">
          <label>
            Nom
            <input type="text" id="birthdayNameInput" maxlength="100" required autocomplete="off">
          </label>
          <label>
            Date
            <input type="date" id="birthdayDateInput" required>
          </label>
          <button type="submit" class="primary-btn">Ajouter</button>
        </form>
        <div class="birthday-list" id="birthdayList"></div>
      </div>
    </div>
  </div>
</div>

<div id="eventModalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">Nouvel événement</h2>
    <form id="eventForm">
      <div class="field-row">
        <label class="title-field">
          Titre
          <input type="text" id="fieldTitle" required maxlength="200" placeholder="Nom de l'événement" autocomplete="off">
        </label>
        <div class="icon-picker">
          <button type="button" class="icon-picker-btn" id="iconPickerBtn" aria-label="Choisir une icône">
            <img id="iconPickerPreview" alt="">
          </button>
          <div class="icon-picker-popup hidden" id="iconPickerPopup"></div>
        </div>
        <button type="button" class="notify-clear-btn disabled" id="iconClearBtn" aria-label="Retirer l'icône"></button>
      </div>
      <label>
        Membres concernés
        <div id="fieldMembers" class="member-checkboxes"></div>
      </label>
      <div class="field-row">
        <label>
          Date de début
          <input type="date" id="fieldDate" required>
        </label>
        <label>
          Date de fin (optionnel)
          <input type="date" id="fieldEndDate">
        </label>
      </div>
      <div class="field-row">
        <label>
          Heure de début (optionnel)
          <input type="text" id="fieldStartTime" inputmode="numeric" placeholder="HH:mm" maxlength="5">
        </label>
        <label>
          Heure de fin (optionnel)
          <input type="text" id="fieldEndTime" inputmode="numeric" placeholder="HH:mm" maxlength="5">
        </label>
      </div>
      <label>
        Description (optionnel)
        <textarea id="fieldDescription" rows="3" maxlength="2000"></textarea>
      </label>
      <p id="formError" class="form-error hidden"></p>
      <div class="modal-actions">
        <button type="button" id="deleteEventBtn" class="danger-btn hidden">Supprimer</button>
        <div class="modal-actions-right">
          <button type="button" id="cancelModalBtn" class="secondary-btn">Annuler</button>
          <button type="submit" class="primary-btn">Enregistrer</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="eventDetailOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <p id="detailDateTime" class="detail-datetime"></p>
    <div class="detail-section">
      <div id="detailMembers" class="member-checkboxes"></div>
    </div>
    <div class="detail-section">
      <div class="notify-options" id="detailNotifyOptions">
        <button type="button" class="notify-option" data-minutes="1440">1 jour</button>
        <button type="button" class="notify-option" data-minutes="60">1h</button>
        <button type="button" class="notify-option" data-minutes="15">15min</button>
      </div>
      <button type="button" class="notify-none-btn" id="detailNotifyNoneBtn">Ne pas notifier</button>
    </div>
    <div class="modal-actions">
      <button type="button" id="detailDeleteBtn" class="danger-btn">Supprimer</button>
      <div class="modal-actions-right">
        <button type="button" id="detailEditBtn" class="primary-btn">Modifier</button>
      </div>
    </div>
  </div>
</div>

<div id="notifyModalOverlay" class="modal-overlay hidden">
  <div class="modal notify-modal">
    <h2>🔔 Notifier</h2>
    <div class="notify-options" id="notifyChoiceOptions">
      <button type="button" class="notify-option" data-minutes="1440">1 jour</button>
      <button type="button" class="notify-option" data-minutes="60">1h</button>
      <button type="button" class="notify-option" data-minutes="15">15min</button>
    </div>
    <button type="button" class="notify-none-btn" id="notifyNoneBtn">Ne pas notifier</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<script src="nav.js"></script>
<script src="agenda.js"></script>
<script src="notes.js"></script>
<script src="todos.js"></script>
<script src="birthdays.js"></script>
</body>
</html>
